# Render Blueprint (optional convenience).
# You can also configure these settings manually in the Render dashboard.
# See README section "Deploy to Render" for the manual steps.
services:
  - type: web
    name: ai-capsule
    runtime: node
    plan: free
    # Build the React client, then the server serves it.
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random value
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: POST_LOGIN_REDIRECT
        value: /dashboard
      - key: DATABASE_FILE
        value: ./data/ai-capsule.sqlite
      # Set these three manually in the dashboard (do not commit real secrets):
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OAUTH_CALLBACK_URL
        sync: false # e.g. https://ai-capsule.onrender.com/auth/github/callback
